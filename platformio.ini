; Waveshare ESP32-S3-Touch-LCD-3.49 / 3.49B, V2 board (PCB "Rev1.1").
; ESP32-S3R8: 16MB QIO flash, 8MB octal PSRAM.
[env:waveshare-349-v2]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_WAVESHARE_349=1
    -DBOARD_HAS_PSRAM
    ; USB-C goes to the S3's native USB: make Serial the USB CDC port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI is only used for its off-screen sprite (fonts, text, shapes).
    ; hal.cpp drives the AXS15231B panel itself, so these pins are never
    ; touched. They just satisfy TFT_eSPI's compile-time setup.
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=172
    -DTFT_HEIGHT=640
    -DTFT_MISO=-1
    -DTFT_MOSI=-1
    -DTFT_SCLK=-1
    -DTFT_CS=-1
    -DTFT_DC=-1
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DUSE_FSPI_PORT=1
    ; Touch is handled in hal.cpp, not by TFT_eSPI. This hides TFT_eSPI's
    ; harmless "TOUCH_CS pin not defined" warning.
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; LCDwiki 3.2inch ESP32-32E display (E32R32P / E32N32P).
; Classic ESP32 (ESP32-D0WD-V3), 4MB flash, no PSRAM. USB-C via a CH340C.
; ST7789 240x320 and XPT2046 resistive touch share one SPI bus.
[env:esp32-32e]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; 2MB app + 2MB LittleFS for GIF characters, same as the M5StickC Plus build
board_build.partitions = no_ota.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_ESP32_32E=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; If red and blue come out swapped, uncomment this:
    ; -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    ; LCD reset is tied to EN; TFT_eSPI sends a software reset instead.
    -DTFT_RST=-1
    -DTOUCH_CS=33
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; LCDwiki 2.8inch ESP32-32E display (E32R28T / E32N28T, also sold as "ZLX").
; Same ESP32 module and layout as the 3.2" above, but an ILI9341V panel,
; backlight on IO21, and the XPT2046 touch on its own pins
; (SCK 25, MOSI 32, MISO 39, CS 33, IRQ 36), read in hal_esp32_32e.cpp.
[env:esp32-32e-28]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_ESP32_32E=1
    -DLCD_BL_PIN=21
    -DTOUCH_SPI_SEPARATE=1
    -DROTATION_TEST=1
    -DTOUCH_SPI_SCK=25
    -DTOUCH_SPI_MOSI=32
    -DTOUCH_SPI_MISO=39
    -DTOUCH_SPI_CS=33
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; If colours look inverted or red and blue are swapped, try these:
    ; -DTFT_INVERSION_ON=1
    ; -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; Waveshare ESP32-S3-Touch-LCD-3.49 / 3.49B, V2 board (PCB "Rev1.1").
; ESP32-S3R8: 16MB QIO flash, 8MB octal PSRAM.
[env:waveshare-349-v2]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; USB-C goes to the S3's native USB: make Serial the USB CDC port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI is only used for its off-screen sprite (fonts, text, shapes).
    ; hal.cpp drives the AXS15231B panel itself, so these pins are never
    ; touched. They just satisfy TFT_eSPI's compile-time setup.
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=172
    -DTFT_HEIGHT=640
    -DTFT_MISO=-1
    -DTFT_MOSI=-1
    -DTFT_SCLK=-1
    -DTFT_CS=-1
    -DTFT_DC=-1
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DUSE_FSPI_PORT=1
build_src_filter = +<*> +<buddies/>
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
